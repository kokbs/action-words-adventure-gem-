<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Action Words Adventure - AR & Explore</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Updated A-Frame (1.4.2) & MindAR (1.2.5) for iOS Safari compatibility -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent A-Frame from hijacking body background on iOS */
        .a-canvas {
            z-index: 1 !important;
        }

        /* Video element fix for iOS Safari */
        video {
            object-fit: cover !important;
        }

        #ar-view {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            z-index: 100;
            background: #000;
        }

        .hotspot {
            position: absolute;
            border-radius: 1rem;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .hotspot:hover, .hotspot:focus {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: #facc15;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- MAIN MENU -->
    <div id="main-menu" class="max-w-md w-full flex flex-col items-center justify-center min-h-[80vh] my-auto pop-in">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-600 drop-shadow-sm mb-2 text-center leading-tight">
            Action Words<br><span class="text-green-500">Adventure</span>
        </h1>
        <p class="text-base text-slate-600 font-medium mb-8 text-center">Interactive Learning Fun!</p>

        <div class="flex flex-col gap-4 w-full">
            <!-- Launch AR Button -->
            <button onclick="startAR()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-5 px-6 rounded-2xl shadow-xl transition-transform active:scale-95 border-b-4 border-indigo-800 flex items-center justify-center gap-3 text-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-indigo-200" viewBox="0 0 256 256"><path fill="currentColor" d="M208,40H160a8,8,0,0,0,0,16h40V96a8,8,0,0,0,16,0V48A8,8,0,0,0,208,40ZM56,96V56H96a8,8,0,0,0,0-16H48a8,8,0,0,0-8,8V96a8,8,0,0,0,16,0ZM96,200H56V160a8,8,0,0,0-16,0v48a8,8,0,0,0,8,8H96a8,8,0,0,0,0-16Zm120-48a8,8,0,0,0-8,8v40H160a8,8,0,0,0,0,16h48a8,8,0,0,0,8-8V160A8,8,0,0,0,216,152Zm-48-52a40,40,0,1,0,40,40A40,40,0,0,0,168,100Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,168,164ZM88,100a40,40,0,1,0,40,40A40,40,0,0,0,88,100Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,88,164Z"></path></svg>
                AR Camera Mode
            </button>

            <!-- Launch Explore Button -->
            <button onclick="startExplore()" class="bg-white hover:bg-slate-50 text-slate-700 font-bold py-5 px-6 rounded-2xl shadow-md transition-transform active:scale-95 border-2 border-slate-200 flex items-center justify-center gap-3 text-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-yellow-500" viewBox="0 0 256 256"><path fill="currentColor" d="M232,116a60.07,60.07,0,0,0-60-60H140.94l11.53-11.53a8,8,0,0,0-11.32-11.31l-25,25a8,8,0,0,0,0,11.31l25,25a8,8,0,0,0,11.32-11.31L140.94,72H172a44,44,0,0,1,44,44v40a44,44,0,0,1-44,44H84a44,44,0,0,1-44-44V116A44,44,0,0,1,84,72h20a8,8,0,0,0,0-16H84a60.07,60.07,0,0,0-60,60v40a60.07,60.07,0,0,0,60,60h88a60.07,60.07,0,0,0,60-60Z"></path></svg>
                Screen Tap Mode
            </button>
        </div>

        <div class="mt-8 text-xs text-slate-400 text-center">
            Tip: iOS users must allow camera permissions when prompted.
        </div>
    </div>

    <!-- EXPLORE MODE VIEW -->
    <div id="explore-view" class="hidden max-w-3xl w-full flex-col items-center pb-24 pop-in">
        <div class="w-full flex justify-between items-center mb-4">
            <button onclick="backToMenu()" class="bg-white border-2 border-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold hover:bg-slate-50 flex items-center gap-2 shadow-sm">
                &larr; Back
            </button>
            <h2 class="text-xl font-bold text-blue-600">Screen Tap Mode</h2>
        </div>

        <div class="relative w-full max-w-lg mx-auto rounded-xl overflow-hidden shadow-md border-2 border-slate-200 bg-slate-50 flex items-center justify-center mb-6">
            <div id="image-wrapper" class="relative w-full" style="aspect-ratio: 7 / 10;">
                <img src="book-page_5.jpg" alt="Book Cover" class="absolute inset-0 w-full h-full object-cover block select-none pointer-events-none" onerror="this.style.display='none'; document.getElementById('missing-img-msg').classList.remove('hidden');">
                
                <div id="missing-img-msg" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 hidden p-6 text-center bg-slate-100">
                    <p class="font-bold text-lg text-slate-500">book-page_5.jpg is missing</p>
                </div>
                
                <!-- RUN, READ, WRITE Hotspots -->
                <div class="hotspot" style="top: 35%; left: 7%; width: 45%; height: 39%;" onclick="selectActivity('run')"></div>
                <div class="hotspot" style="top: 27%; left: 64%; width: 36%; height: 32%;" onclick="selectActivity('read')"></div>
                <div class="hotspot" style="top: 60%; left: 51%; width: 49%; height: 35%;" onclick="selectActivity('write')"></div>
            </div>
        </div>

        <div id="explore-card-container" class="w-full max-w-lg hidden"></div>
    </div>

    <!-- AR CAMERA VIEW -->
    <div id="ar-view" class="hidden">
        <!-- UI Overlays for AR -->
        <div class="absolute top-4 left-4 right-4 z-[999] flex justify-between items-start pointer-events-auto">
            <button onclick="stopAR()" class="bg-red-500 text-white px-5 py-3 rounded-full font-bold shadow-xl border-b-4 border-red-700 active:scale-95">
                &larr; Exit AR
            </button>
            <div id="ar-scan-prompt" class="bg-slate-900/90 text-white px-4 py-3 rounded-2xl text-sm font-medium shadow-lg max-w-[220px] text-center backdrop-blur-md border border-slate-700">
                Point camera at a picture on the book page!
            </div>
        </div>

        <div class="absolute bottom-6 left-4 right-4 z-[999] flex justify-center pointer-events-none">
            <div id="ar-card-wrapper" class="w-full max-w-md pointer-events-auto hidden">
                <!-- AR Flashcard modal -->
            </div>
        </div>

        <!-- A-FRAME AR SCENE -->
        <a-scene 
            mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: yes; uiError: yes; filterMinCF: 0.001; filterBeta: 1000;" 
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true" 
            vr-mode-ui="enabled: false" 
            device-orientation-permission-ui="enabled: false"
            embedded>
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            
            <!-- Index 0: RUN -->
            <a-entity mindar-image-target="targetIndex: 0" id="target-run"></a-entity>
            <!-- Index 1: READ -->
            <a-entity mindar-image-target="targetIndex: 1" id="target-read"></a-entity>
            <!-- Index 2: WRITE -->
            <a-entity mindar-image-target="targetIndex: 2" id="target-write"></a-entity>
        </a-scene>
    </div>

    <!-- LOGIC SCRIPTS -->
    <script>
        const activitiesData = {
            run: { word: "RUN", color: "text-red-600", bg: "bg-red-50", border: "border-red-200", sentence: "I run to school." },
            read: { word: "READ", color: "text-green-600", bg: "bg-green-50", border: "border-green-200", sentence: "She reads a story." },
            write: { word: "WRITE", color: "text-blue-600", bg: "bg-blue-50", border: "border-blue-200", sentence: "He writes in his book." }
        };

        const synth = window.speechSynthesis;
        let activeWordId = null;

        // Card HTML Template
        function createCardHTML(activityData, isAR = false) {
            const speechText = `${activityData.word}. ${activityData.sentence}`;
            const shadow = isAR ? 'shadow-2xl' : 'shadow-xl';
            return `
                <div class="bg-white rounded-3xl ${shadow} border-4 ${activityData.border} overflow-hidden pop-in w-full">
                    <div class="${activityData.bg} px-5 py-4 border-b-2 ${activityData.border} flex justify-between items-center">
                        <h2 class="text-3xl font-black ${activityData.color} tracking-wide">${activityData.word}</h2>
                    </div>
                    <div class="p-5">
                        <p class="text-xl text-slate-800 font-bold mb-6">"${activityData.sentence}"</p>
                        <div class="flex gap-3">
                            <button onclick="playTTS('${speechText}')" class="flex-1 flex items-center justify-center gap-2 bg-indigo-600 text-white border-2 border-indigo-700 py-3 rounded-xl font-bold active:scale-95 transition-all shadow-md">
                                🔊 Listen
                            </button>
                            <button onclick="stopTTS()" class="flex-none p-3 bg-red-50 hover:bg-red-100 text-red-600 border-2 border-red-200 rounded-xl active:scale-95 transition-all">
                                ⏹ Stop
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Navigation ---
        function startExplore() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('explore-view').classList.remove('hidden');
            document.getElementById('explore-view').classList.add('flex');
        }

        function backToMenu() {
            stopTTS();
            document.getElementById('explore-view').classList.add('hidden');
            document.getElementById('explore-view').classList.remove('flex');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('explore-card-container').classList.add('hidden');
        }

        async function startAR() {
            document.getElementById('main-menu').classList.add('hidden');
            const arView = document.getElementById('ar-view');
            arView.classList.remove('hidden');

            // Force WebGL / Canvas repaint for iOS Safari
            window.dispatchEvent(new Event('resize'));

            const sceneEl = document.querySelector('a-scene');
            
            try {
                if (sceneEl.systems["mindar-image-system"]) {
                    await sceneEl.systems["mindar-image-system"].start();
                }
            } catch (err) {
                console.error("AR Start Error:", err);
                alert("Camera permission is required for AR. Please allow camera access in Safari settings.");
            }
        }

        function stopAR() {
            stopTTS();
            activeWordId = null;
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.systems["mindar-image-system"]) {
                sceneEl.systems["mindar-image-system"].stop();
            }
            document.getElementById('ar-view').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('ar-card-wrapper').classList.add('hidden');
            document.getElementById('ar-scan-prompt').classList.remove('hidden');
        }

        // --- Interactions ---
        function selectActivity(wordId) {
            stopTTS();
            const container = document.getElementById('explore-card-container');
            container.innerHTML = createCardHTML(activitiesData[wordId], false);
            container.classList.remove('hidden');
            playTTS(`${activitiesData[wordId].word}. ${activitiesData[wordId].sentence}`);
        }

        function triggerARActivity(wordId) {
            document.getElementById('ar-scan-prompt').classList.add('hidden');
            
            if (activeWordId !== wordId) {
                activeWordId = wordId;
                stopTTS();
                const container = document.getElementById('ar-card-wrapper');
                container.innerHTML = createCardHTML(activitiesData[wordId], true);
                container.classList.remove('hidden');
                
                playTTS(`${activitiesData[wordId].word}. ${activitiesData[wordId].sentence}`);
            }
        }

        // Target Event Listeners
        document.addEventListener("DOMContentLoaded", () => {
            const runTarget = document.querySelector('#target-run');
            const readTarget = document.querySelector('#target-read');
            const writeTarget = document.querySelector('#target-write');

            if (runTarget) runTarget.addEventListener("targetFound", () => triggerARActivity('run'));
            if (readTarget) readTarget.addEventListener("targetFound", () => triggerARActivity('read'));
            if (writeTarget) writeTarget.addEventListener("targetFound", () => triggerARActivity('write'));
        });

        // TTS Speech Synthesis
        function playTTS(text) {
            if (!synth) return;
            synth.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            utterance.rate = 0.85; 
            
            const voices = synth.getVoices();
            const preferredVoice = voices.find(v => v.lang === 'en-US' && !v.name.includes('Google')) || voices.find(v => v.lang.startsWith('en-'));
            if (preferredVoice) utterance.voice = preferredVoice;
            
            synth.speak(utterance);
        }

        function stopTTS() {
            if (synth) synth.cancel();
        }
    </script>
</body>
</html>
